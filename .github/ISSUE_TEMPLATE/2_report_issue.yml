name: Bug report
description: Report a reproducible YomuDoom problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YomuDoom version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and context
      description: Remove private data before posting logs or screenshots.
