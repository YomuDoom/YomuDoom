name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  YOMUDOOM_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf '%s\n' '- See the full changelog on GitHub.' > release-notes.md
          fi

      - name: Build signed APK
        run: ./gradlew assembleRelease -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-universal-release.apk YomuDoom-${{ github.ref_name }}-universal.apk

      - name: Generate release integrity files
        shell: bash
        run: |
          apk="YomuDoom-${GITHUB_REF_NAME}-universal.apk"
          sha256sum "$apk" > SHA256SUMS.txt

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          certificate_digest="$($apksigner verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          if [ -z "$certificate_digest" ]; then
            echo "Could not read the APK signing certificate" >&2
            exit 1
          fi
          printf '%s\n' "$certificate_digest" > SIGNING_CERTIFICATE_SHA256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ github.ref_name == 'v0.21.0' && 'YomuDoom v0.21.0 — Public Beta' || format('YomuDoom {0}', github.ref_name) }}
          body_path: release-notes.md
          files: |
            YomuDoom-${{ github.ref_name }}-universal.apk
            SHA256SUMS.txt
            SIGNING_CERTIFICATE_SHA256.txt
          draft: false
          prerelease: false
          token: ${{ github.token }}
