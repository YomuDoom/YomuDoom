name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: YomuDoom-release/website/package-lock.json
      - run: npm ci
        working-directory: YomuDoom-release/website
      - run: npm run build -- --prerender-all
        working-directory: YomuDoom-release/website
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/YomuDoom"
          NEXT_PUBLIC_SITE_ORIGIN: "https://yomudoom.github.io"
          NEXT_PUBLIC_METRICS_URL: ${{ vars.YOMUDOOM_METRICS_URL }}
      - run: touch YomuDoom-release/website/dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: YomuDoom-release/website/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
